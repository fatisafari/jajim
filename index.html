<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jajim — A Magazine in Five Threads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261104-1055-align" />
</head>
<body>

  <!-- ===== Persistent header (same on every screen) ===== -->
  <header class="site-header home">
    <a href="about.html" class="corner corner-left">ABOUT</a>
    <div class="brand">
      <span>JAJIM</span>
      <span>MAGAZINE</span>
    </div>
    <a href="category.html?cat=people" class="corner corner-right">CONTENTS</a>
  </header>

  <!-- ===== HOME : full-bleed loom with dot hotspots ===== -->
  <section class="cover" id="top">
    <div class="reveal-layer" id="reveal" aria-hidden="true">
      <div class="reveal-grid"></div>
    </div>
    <!-- Desktop hero controls: independent from mobile -->
    <div class="desktop-hero">
      <button class="dot" data-target="people"     style="top:24%; left:31%">People</button>
      <button class="dot" data-target="culture"    style="top:42%; left:47%">Culture</button>
      <button class="dot" data-target="experience" style="top:53%; left:23%">Stories</button>
      <button class="dot" data-target="trend"      style="top:73%; left:72%">Now</button>
      <button class="dot" data-target="style"      style="top:66%; left:60%">Style</button>
    </div>

    <!-- Mobile hero controls: image-relative and independent from desktop -->
    <div class="mobile-hero">
      <img
        class="mobile-cover-image"
        src="media/jajim-cover-mobile.jpg"
        width="1882"
        height="3344"
        alt=""
        aria-hidden="true"
      />

      <button class="dot" data-target="people" data-label="People">People</button>
      <button class="dot" data-target="culture" data-label="Culture">Culture</button>
      <button class="dot" data-target="experience" data-label="Stories">Stories</button>
      <button class="dot" data-target="style" data-label="Style">Style</button>
      <button class="dot" data-target="trend" data-label="Now">Now</button>
    </div>
  </section>

  <script>
    // ---- Hover-reveal media collage (Readymag-style) ----
    const reveal = document.getElementById('reveal');
    const cover  = document.getElementById('top');

    // Each thread: a taped marker label + borderless image blocks anchored
    // to the screen edges (grid-aligned). slot = tr|bl|bc|tl|mr
    const threads = {
      people: {
        caption: 'FACE TO FACE',
        tiles: [['media/people/01.jpg','tr'], ['media/people/02.mp4','bl']]
      },
      culture: {
        caption: 'THE WIDER WEAVE',
        tiles: [['media/culture/01.jpg','tl'], ['media/culture/02.jpg','mr']]
      },
      experience: {
        caption: 'LIVING LIVE',
        tiles: [['media/stories/01.mp4','tr'], ['media/stories/02.jpg','bl']]
      },
      trend: {
        caption: 'RIGHT NOW',
        tiles: [['media/now/01.jpg','tr'], ['media/now/02.mp4','bl']]
      },
      style: {
        caption: 'WORN IN',
        tiles: [['media/style/01.mp4','mr'], ['media/style/02.jpg','tl']]
      }
    };

    // Tag: Mobile preview guard
    // Description: Embedded mobile browsers do not always report hover/pointer
    // capabilities consistently, so maxTouchPoints is used as a second check.
    const isTouch =
      window.matchMedia('(hover: none), (pointer: coarse)').matches ||
      navigator.maxTouchPoints > 0 ||
      new URLSearchParams(location.search).has('touch');

    // Pre-build preview media for desktop and touch devices.
    const groups = {};
    Object.entries(threads).forEach(([key, cfg]) => {
      const group = document.createElement('div');
      group.className = 'reveal-group';
      group.dataset.thread = key;

      cfg.tiles.forEach(([src, slot], i) => {
        const fig = document.createElement('figure');
        fig.className = 'reveal-tile ' + slot;
        fig.style.setProperty('--i', i);
        let media;
        if (src.endsWith('.mp4') || src.endsWith('.mov')) {
          media = document.createElement('video');
          media.src = src;
          media.muted = true; media.loop = true;
          media.playsInline = true;
          media.preload = 'none';   // fetch only on first hover, not on page load
          media.setAttribute('muted', '');
          media.setAttribute('playsinline', '');
        } else {
          media = document.createElement('img');
          media.src = src; media.alt = '';
        }
        fig.appendChild(media);
        group.appendChild(fig);
      });

      const cap = document.createElement('span');
      cap.className = 'reveal-caption';
      cap.textContent = cfg.caption;
      // Sit the tape label just below-right of this thread's dot.
      const dot = document.querySelector(`.dot[data-target="${key}"]`);
      if (dot) {
        cap.style.left = `calc(${dot.style.left} + 64px)`;
        cap.style.top  = `calc(${dot.style.top} + 12px)`;

        // Tag: Desktop preview anchor
        // Description: Store the section dot position so the desktop reveal
        // can visually expand outward from the exact point the user selected.
        group.style.setProperty('--anchor-x', dot.style.left);
        group.style.setProperty('--anchor-y', dot.style.top);
      }
      group.appendChild(cap);

      reveal.appendChild(group);
      groups[key] = group;
    });

    const dots = [...document.querySelectorAll('.dot')];
    let active = null;
    let previewTimer = null;
    let desktopLocked = false;

    // Tag: Desktop hotspot collision
    // Description: Hide only desktop bullets whose visible label area is
    // physically covered by an opened preview tile. Mobile is untouched.
    function rectsOverlap(a, b, gap = 0) {
      return (
        a.left < b.right + gap &&
        a.right > b.left - gap &&
        a.top < b.bottom + gap &&
        a.bottom > b.top - gap
      );
    }

    function keepMediaAwayFromActiveDot(group, key) {
      if (isTouch || !group) return;

      const activeDot = document.querySelector(`.desktop-hero .dot[data-target="${key}"]`);
      if (!activeDot) return;

      const dotRect = activeDot.getBoundingClientRect();
      const safetyGap = 22;

      group.querySelectorAll('.reveal-tile').forEach(tile => {
        tile.style.removeProperty('left');
        tile.style.removeProperty('top');

        const tileRect = tile.getBoundingClientRect();
        if (!rectsOverlap(dotRect, tileRect, safetyGap)) return;

        const coverRect = cover.getBoundingClientRect();
        const moveRight = (dotRect.right + safetyGap) - tileRect.left;
        const moveLeft = tileRect.right - (dotRect.left - safetyGap);
        const roomRight = coverRect.right - tileRect.right;
        const roomLeft = tileRect.left - coverRect.left;

        let newLeft;
        if (roomRight >= moveRight || roomRight >= roomLeft) {
          newLeft = tileRect.left - coverRect.left + moveRight;
        } else {
          newLeft = tileRect.left - coverRect.left - moveLeft;
        }

        const maxLeft = Math.max(0, coverRect.width - tileRect.width);
        newLeft = Math.min(Math.max(0, newLeft), maxLeft);
        tile.style.left = `${newLeft}px`;
      });
    }

    function updateCoveredDesktopDots(group, activeKey) {
      if (isTouch || !group) return;

      const desktopDots = [...document.querySelectorAll('.desktop-hero .dot')];
      const tiles = [...group.querySelectorAll('.reveal-tile')];

      desktopDots.forEach(dot => {
        if (dot.dataset.target === activeKey) {
          dot.classList.remove('is-covered');
          return;
        }

        const dotRect = dot.getBoundingClientRect();
        const covered = tiles.some(tile => {
          const tileRect = tile.getBoundingClientRect();
          return rectsOverlap(dotRect, tileRect);
        });

        dot.classList.toggle('is-covered', covered);
      });
    }

    function clearCoveredDesktopDots() {
      document.querySelectorAll('.desktop-hero .dot.is-covered')
        .forEach(dot => dot.classList.remove('is-covered'));
    }

    function setPlayback(group, playing) {
      if (!group) return;
      group.querySelectorAll('video').forEach(v => {
        if (playing) { v.currentTime = 0; v.play().catch(() => {}); }
        else v.pause();
      });
    }

    function clearPreviewTimer() {
      if (previewTimer) {
        clearTimeout(previewTimer);
        previewTimer = null;
      }
    }

    function schedulePreviewClose() {
      clearPreviewTimer();
      if (isTouch) {
        previewTimer = setTimeout(hide, 10000);
      }
    }

    function show(key) {
      if (!groups[key]) return;

      if (active && active !== key) {
        groups[active].classList.remove('on');
        setPlayback(groups[active], false);
      }

      active = key;
      cover.classList.add('revealing');
      groups[key].classList.add('on');

      // Tag: Active section marker
      // Description: Keep the selected dot above its preview on both desktop
      // and mobile so the reveal clearly belongs to that section.
      dots.forEach(dot => {
        dot.classList.toggle('is-active', dot.dataset.target === key);
      });

      if (isTouch) {
        cover.classList.add('touch-previewing');
      }

      setPlayback(groups[key], true);
      schedulePreviewClose();
    }

    function hide() {
      clearPreviewTimer();

      if (active && groups[active]) {
        groups[active].classList.remove('on');
        setPlayback(groups[active], false);
      }

      active = null;
      cover.classList.remove('revealing');
      cover.classList.remove('touch-previewing');
      cover.classList.remove('desktop-previewing');
      dots.forEach(dot => dot.classList.remove('is-active'));
      clearCoveredDesktopDots();
      desktopLocked = false;
    }

    // Tag: Cover navigation
    // Description:
    // Desktop: hover previews only; leaving the point closes immediately.
    // Clicking a desktop point opens its category directly.
    // Mobile: first tap previews for 10 seconds; second tap opens the category.
    dots.forEach(btn => {
      const key = btn.dataset.target;

      if (!isTouch) {
        // Tag: Stable desktop hover preview
        // Description: Open while the hotspot is hovered. On leave, defer one frame
        // and close only if the pointer is truly no longer over the same hotspot.
        btn.addEventListener('mouseenter', () => {
          show(key);
        });

        btn.addEventListener('mouseleave', () => {
          requestAnimationFrame(() => {
            if (active === key && !btn.matches(':hover')) {
              hide();
            }
          });
        });
      }

      btn.addEventListener('click', event => {
        event.stopPropagation();

        if (!isTouch) {
          location.href = 'category.html?cat=' + key;
          return;
        }

        if (active === key) {
          location.href = 'category.html?cat=' + key;
          return;
        }

        show(key);
      });
    });

    if (!isTouch) {
      // Desktop preview lifetime is controlled only by hotspot hover.
    } else {
      // Tapping the cover away from a dot closes the preview immediately.
      cover.addEventListener('click', event => {
        if (!event.target.closest('.dot')) hide();
      });
    }
  </script>

</body>
</html>
